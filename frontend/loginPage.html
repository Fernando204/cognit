  }
  .scrim{
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(1000px 700px at 12% 15%, rgba(2, 1, 1, 0), transparent 60%),
      linear-gradient(100deg, #f7f5f0 0%, #f7f5f0a4 30%, rgba(246, 248, 251, 0) 58%, rgba(0, 0, 0, 0.596) 100%),
      linear-gradient(rgba(246,248,251,0.42), rgba(246, 248, 251, 0));
  }
  .blob{
    position:fixed; z-index:-1; border-radius:50%;
    filter:blur(70px); opacity:0.35; pointer-events:none;
    animation:drift 14s ease-in-out infinite;
  }
  .blob-green{ width:420px; height:420px; top:-120px; right:-80px; background:radial-gradient(circle, #7CF0BB 0%, transparent 70%); }
  .blob-blue{ width:460px; height:460px; bottom:-160px; left:-120px; background:radial-gradient(circle, #AFC8FF 0%, transparent 70%); animation-delay:-7s; }
  @keyframes drift{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(18px,-14px); }
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px clamp(20px,5vw,64px);
    max-width:1360px; margin:0 auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:30px; height:auto; }
  .brand span{ font-weight:700; font-size:1.08rem; letter-spacing:-0.01em; }
  .help-link{
    font-size:0.88rem; color:var(--muted); text-decoration:none;
    display:flex; align-items:center; gap:6px;
  }
  .help-link:hover{ color:var(--ink); }

  /* ---------- Hero ---------- */
  .hero{
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    align-items:center;
    gap:56px;
    max-width:90vw;
    margin:0 auto;
    padding:36px clamp(20px,5vw,64px) 60px;
    min-height:calc(100vh - 82px);
  }

  .hero-logo{
    display:flex; align-items:center; gap:14px;
    margin:0 0 22px;
  }
  .hero-logo img{ width:clamp(40px,4.2vw,54px); height:auto; }
  .hero-logo span{
    font-size:clamp(2.4rem, 5vw, 3.4rem);
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1;
  }

  .eyebrow{
    color:var(--green);
    font-weight:700;
    font-size:0.75rem;
    letter-spacing:0.09em;
    text-transform:uppercase;
    margin:0 0 10px;
  }
  .hero-copy h1{
    font-size:clamp(1.25rem, 1.9vw, 1.6rem);
    font-weight:600;
    line-height:1.4;
    letter-spacing:-0.005em;
    margin:0 0 16px;
    max-width:460px;
    color:var(--ink);
  }
  .hero-copy h1 .accent{ color:var(--green); font-weight:700; }
  .hero-copy p.lede{
    color:var(--muted);
    font-size:0.96rem;
    line-height:1.6;
    max-width:420px;
    margin:0 0 24px;
  }

  .draw-line{ width:210px; height:18px; display:block; margin-bottom:30px; }
  .draw-line path{
    stroke-dasharray:320; stroke-dashoffset:320;
    animation:drawLine 1.3s 0.35s cubic-bezier(.65,0,.35,1) forwards;
  }
  .draw-line circle{ opacity:0; animation:fadeIn 0.5s 1.5s ease forwards; }
  @keyframes drawLine{ to{ stroke-dashoffset:0; } }
  @keyframes fadeIn{ to{ opacity:1; } }

  .module-pills{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px; }
  .module-pills button{
    font: inherit; font-size:0.82rem; font-weight:500; color:var(--green-dark);
    background:var(--green-soft);
    border:1px solid rgba(18,169,107,0.18);
    padding:7px 14px; border-radius:999px;
    cursor:pointer;
    transition:transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .module-pills button:hover{ transform:translateY(-2px); background:#d8f5e6; }
  .module-pills button.active{
    background:var(--ink); color:#fff; border-color:var(--ink);
  }
  .module-pills button.active:hover{ transform:none; background:var(--ink); }
  .module-pills button:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  /* Mini finance card, echoing the landing page's dashboard preview */
  .mini-card{
    position:relative;
    width:290px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow-2);
    padding:18px 20px 20px;
    animation:floaty 6s ease-in-out infinite;
    transition: all 0.5s;
  }
  @keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(30px);} }
  .mini-card:hover{ animation-play-state:paused; 
transform: scale(1.1);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.651);
}
  .mini-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .mini-head .title-group{ display:flex; align-items:center; gap:8px; }
  .mini-head span.title{ font-size:0.8rem; font-weight:600; color:var(--ink); }
  .mini-head span.api-tag{
    font-size:0.64rem; font-weight:700; letter-spacing:0.04em;
    color:var(--blue); background:var(--blue-soft);
    padding:2px 7px; border-radius:6px;
  }
  .mini-head span.status{ font-size:0.72rem; color:var(--green); display:flex; align-items:center; gap:5px; font-weight:600; }
  .mini-head span.status::before{
    content:""; width:6px; height:6px; border-radius:50%; background:var(--green);
    box-shadow:0 0 0 0 rgba(18,169,107,0.5); animation:pulseDot 2.2s ease-out infinite;
  }
  @keyframes pulseDot{
    0%{box-shadow:0 0 0 0 rgba(18,169,107,0.45);}
    70%{box-shadow:0 0 0 7px rgba(18,169,107,0);}
    100%{box-shadow:0 0 0 0 rgba(18,169,107,0);}
  }
  .mini-label{ font-size:0.74rem; color:var(--muted); margin:0 0 2px; }
  .mini-value{ font-size:1.4rem; font-weight:800; margin:0 0 3px; }
  .mini-trend{ font-size:0.78rem; color:var(--green); font-weight:600; margin:0 0 14px; min-height:1.1em; }
  .mini-bars{ display:flex; align-items:flex-end; gap:6px; height:38px; margin-bottom:14px; }
  .mini-bars i{
    flex:1; border-radius:4px 4px 0 0; background:var(--blue-soft);
    display:block;
  }
  .mini-bars i:last-child{ background:linear-gradient(180deg, var(--green), var(--green-dark)); }
  .mini-caption{
    font-size:0.76rem; line-height:1.5; color:var(--muted);
    margin:0 0 12px;
  }
  .mini-caption.with-rule{ padding-top:12px; border-top:1px solid var(--border); }
  .mini-more{
    font-size:0.78rem; font-weight:600; color:var(--blue); text-decoration:none;
  }
  .mini-more:hover{ text-decoration:underline; }

  #cardBody{ transition:opacity 0.18s ease; min-height:150px; }
  #cardBody.fading{ opacity:0; }

  .card-chips{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 0; }
  .card-chips span{
    font-size:0.72rem; font-weight:500; color:var(--blue);
    background:var(--blue-soft);
    padding:5px 10px; border-radius:8px;
  }
  .diff-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.7rem; font-weight:700; color:var(--green-dark);
    margin:0 0 10px;
  }
  .diff-badge::before{ content:"★"; font-size:0.75rem; }

  /* ---------- Login card ---------- */
  .login-wrap{ justify-self:end; width:100%; max-width:400px; }
  .login-card{
    position:relative;
    background:#f7f5f080;
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:2px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow-2);
    padding:36px 32px 28px;
  }
  .login-status{
    display:flex; align-items:center; gap:7px;
    font-size:0.76rem; color:var(--green); font-weight:600;
    margin-bottom:18px;
  }
  .login-status::before{
    content:""; width:7px; height:7px; border-radius:50%; background:var(--green);
    box-shadow:0 0 0 0 rgba(18,169,107,0.5); animation:pulseDot 2.2s ease-out infinite;
  }
  .login-card h2{ font-size:1.45rem; font-weight:800; margin:0 0 6px; }
  .login-card p.sub{ color:var(--muted); font-size:0.88rem; margin:0 0 26px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.8rem; font-weight:500; color:var(--muted); margin-bottom:7px; }
  .input-shell{
    display:flex; align-items:center;
    border-radius:11px; border:1px solid var(--border);
    background:#fbfcfe;
    transition:border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .input-shell:focus-within{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(47,111,238,0.12);
    background:#fff;
  }
  .field input{
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    color:var(--ink); font-family:'Inter',sans-serif; font-size:0.94rem;
    padding:12px 14px;
  }
  .field input::placeholder{ color:#9aa7bd; }
  .toggle-visibility{
    background:none; border:none; color:var(--muted); cursor:pointer;
    padding:8px 12px 8px 4px; display:flex; align-items:center;
    transition:color 0.2s ease;
  }
  .toggle-visibility:hover{ color:var(--ink); }
  .toggle-visibility svg{ width:18px; height:18px; }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin:4px 0 22px; font-size:0.82rem;
  }
  .remember{ display:flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer; user-select:none; }
  .remember input{
    appearance:none; -webkit-appearance:none; width:16px; height:16px;
    border-radius:5px; border:1px solid #cfd7e6; background:#fff;
    display:grid; place-items:center; cursor:pointer; transition:all 0.2s ease;
  }
  .remember input:checked{ background:var(--green); border-color:var(--green); }
  .remember input:checked::after{
    content:""; width:9px; height:6px;
    border-left:2px solid #fff; border-bottom:2px solid #fff;
    transform:rotate(-45deg) translateY(-1px);
  }
  a.link{ color:var(--blue); text-decoration:none; }
  a.link:hover{ text-decoration:underline; }

  .btn-primary{
    width:100%; padding:13px 16px; border:none; border-radius:11px;
    font-weight:700; font-size:0.95rem; color:#fff;
    background:var(--ink);
    cursor:pointer; transition:background 0.2s ease, transform 0.15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary:hover{ background:#1a2338; }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:focus-visible, .field input:focus-visible, .toggle-visibility:focus-visible, a.link:focus-visible{
    outline:2px solid var(--blue); outline-offset:2px;
  }

  .fine-print{ text-align:center; font-size:0.83rem; color:var(--muted); margin:22px 0 0; }
  .fine-print a{ color:var(--blue); text-decoration:none; }
  .fine-print a:hover{ text-decoration:underline; }

  /* ---------- Footer status chip ---------- */
  .status-chip{
    position:fixed; left:clamp(20px,5vw,64px); bottom:24px;
    display:flex; align-items:center; gap:9px;
    padding:9px 14px 9px 11px; border-radius:999px;
    background:#fff; border:1px solid var(--border);
    box-shadow:0 8px 20px -10px rgba(16,24,40,0.18);
    font-size:0.78rem; color:var(--muted); z-index:5;
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%; background:var(--green);
    box-shadow:0 0 0 0 rgba(18,169,107,0.5); animation:pulseDot 2.2s ease-out infinite;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:960px){
    .hero{ grid-template-columns:1fr; min-height:auto; padding-top:16px; gap:44px; }
    .hero-copy h1, .hero-copy p.lede{ max-width:none; }
    .login-wrap{ justify-self:stretch; max-width:none; }
    .mini-card{ margin:0 auto; }
    .status-chip{ position:static; margin:30px clamp(20px,5vw,64px) 0; }
  }
  @media (max-width:480px){
    .login-card{ padding:30px 22px 24px; }
    .mini-card{ width:100%; }
  }
</style>
</head>

      var step = m.cycle[idx];
      var barsHeights = [44,58,36,70,100];
      var html = '<span class="diff-badge">' + m.diff + '</span>';
      html += '<p class="mini-label" id="miniLabel">' + step.label + '</p>';
      html += '<p class="mini-value" id="miniValue">' + step.value + '</p>';
      html += '<p class="mini-trend" id="miniTrend">' + step.trend + '</p>';
      html += '<div class="mini-bars">' + barsHeights.map(function(h){ return '<i style="height:' + h + '%"></i>'; }).join('') + '</div>';
      html += '<p class="mini-caption with-rule">' + m.desc + '</p>';
      html += '<a href="#" class="mini-more">Como funciona a API →</a>';
      return html;
    }

    function stopCycle(){
      if(cycleTimer){ clearInterval(cycleTimer); cycleTimer = null; }
    }

    function startCycle(m){
      var idx = 0;
      stopCycle();
      cycleTimer = setInterval(function(){
        if(cardHovered) return;
        idx = (idx + 1) % m.cycle.length;
        renderBody(scoreTemplate(m, idx), true);
      }, 3800);
    }

    function renderBody(html, skipFade){
      if(skipFade){
        cardBody.innerHTML = html;
        return;
      }
      cardBody.classList.add('fading');
      setTimeout(function(){
        cardBody.innerHTML = html;
        cardBody.classList.remove('fading');
      }, 160);
    }

    function showModule(key){
      var m = MODULES[key];
      if(!m) return;
      stopCycle();
      cardTitle.textContent = m.title;
      cardTag.textContent = m.tag;
      if(m.type === 'score'){
        renderBody(scoreTemplate(m, 0));
        startCycle(m);
      } else {
        renderBody(simpleTemplate(m));
      }
      Array.prototype.forEach.call(pillsWrap.querySelectorAll('button'), function(btn){
        btn.classList.toggle('active', btn.getAttribute('data-module') === key);
      });
    }

    pillsWrap.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-module]');
      if(!btn) return;
      showModule(btn.getAttribute('data-module'));
    });

    showModule('score');
  })();
</script>
<script>
    (function () {
        const bg = document.querySelector(".bg-photo");
        const intensity = 5; // px de deslocamento máximo

        window.addEventListener("mousemove", (e) => {
            const relX = e.clientX / window.innerWidth - 0.5;
            const relY = e.clientY / window.innerHeight - 0.5;

            const moveX = relX * intensity * 2;
            const moveY = relY * intensity * 2;

            bg.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        window.addEventListener("mouseleave", () => {
            bg.style.transform = "translate(0px, 0px)";
        });
    })();
</script>
</body>
