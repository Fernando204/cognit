<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cognit</title>

    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/pages/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <aside class="sidebar">

        <header>
            <div class="brand">
                <img src="assets/logo.png" alt="Cognit — inteligência conectada ao crescimento">
                <span class="brand-name">COGN<span class="accent">I</span>T</span>
            </div>
        </header>

        <nav class="sidebar-nav">

            <!-- MÓDULO PRINCIPAL -->
            <div class="nav-module open">
                <button class="module-toggle" type="button" title="Principal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9"></rect>
                        <rect x="14" y="3" width="7" height="5"></rect>
                        <rect x="14" y="12" width="7" height="9"></rect>
                        <rect x="3" y="16" width="7" height="5"></rect>
                    </svg>
                    <span>Principal</span>
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6 6 6-6"></path>
                    </svg>
                </button>
                <div class="module-pages">
                    <ul>
                        <li><button class="page-link" type="button" data-page="principal/visao-geral">Visão Geral</button></li>
                        <li><button class="page-link" type="button" data-page="principal/metas">Metas</button></li>
                        <li><button class="page-link" type="button" data-page="principal/colaboradores">Colaboradores</button></li>
                        <li><button class="page-link" type="button" data-page="principal/historico">Histórico</button></li>
                    </ul>
                </div>
            </div>

    
            <div class="nav-module">
                <button class="module-toggle" type="button" title="Estoque">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                        <path d="M3.3 7 12 12l8.7-5"></path>
                        <path d="M12 22V12"></path>
                    </svg>
                    <span>Estoque</span>
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6 6 6-6"></path>
                    </svg>
                </button>
                <div class="module-pages">
                    <ul>
                        <li><button class="page-link" type="button" data-page="estoque/produtos">Produtos</button></li>
                        <li><button class="page-link" type="button" data-page="estoque/encomendas">Encomendas</button></li>
                        <li><button class="page-link" type="button" data-page="estoque/fornecedores">Fornecedores</button></li>
                        <li><button class="page-link" type="button" data-page="estoque/historico-movimentacoes">Histórico de Movimentações</button></li>
                    </ul>
                </div>
            </div>

   
            <div class="nav-module">
                <button class="module-toggle" type="button" title="Financeiro">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    <span>Financeiro</span>
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6 6 6-6"></path>
                    </svg>
                </button>
                <div class="module-pages">
                    <ul>
                        <li><button class="page-link" type="button" data-page="financeiro/dashboard">Dashboard Financeiro</button></li>
                        <li><button class="page-link" type="button" data-page="financeiro/fluxo">Fluxo</button></li>
                        <li><button class="page-link" type="button" data-page="financeiro/lancamentos-recorrentes">Lançamentos Recorrentes</button></li>
                        <li><button class="page-link" type="button" data-page="financeiro/contas">Contas</button></li>
                    </ul>
                </div>
            </div>

            <div class="nav-module">
                <button class="module-toggle" type="button" title="Vendas">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Vendas</span>
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6 6 6-6"></path>
                    </svg>
                </button>
                <div class="module-pages">
                    <ul>
                        <li><button class="page-link" type="button" data-page="vendas/dashboard">Dashboard de Vendas</button></li>
                        <li><button class="page-link" type="button" data-page="vendas/clientes">Clientes</button></li>
                        <li><button class="page-link" type="button" data-page="vendas/nova-venda">Nova Venda</button></li>
                        <li><button class="page-link" type="button" data-page="vendas/lista-vendas">Lista de Vendas</button></li>
                        <li><button class="page-link" type="button" data-page="vendas/pedidos">Pedidos</button></li>
                    </ul>
                </div>
            </div>

        </nav>

        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Ativar modo claro" style="width: calc(100% - 24px); margin: 0 12px 12px;">
            <span data-theme-icon aria-hidden="true">☀</span>
            <span data-theme-label>Claro</span>
        </button>

        <button class="sidebar-toggle" id="sidebarToggle" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 6l-6 6 6 6"></path>
            </svg>
            <span>Recolher</span>
        </button>

    </aside>


    <main class="main-content">
        <!-- Conteúdo do sistema injetado via JS (src/router.js) -->
    </main>

    <script type="module" src="src/theme.js"></script>
    <script type="module" src="src/main.js"></script>

</body>

</html>
