<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-mail confirmado · Horse Control</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --bg:         #0d1b2e;
          --surface:    #112240;
          --border:     rgba(201, 168, 76, 0.15);
          --gold:       #c9a84c;
          --gold-hover: #b8922f;
          --gold-glow:  rgba(201, 168, 76, 0.12);
          --text:       #f0e6d0;
          --muted:      #7a8fa6;
          --radius:     14px;
        }

        body {
          min-height: 100dvh;
          background: var(--bg);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          color: var(--text);
          padding: 24px;
        }

        body::before {
          content: "";
          position: fixed;
          inset: 0;
          background: radial-gradient(ellipse 55% 45% at 50% 35%, rgba(201, 168, 76, 0.06) 0%, transparent 70%);
          pointer-events: none;
        }

        .card {
          position: relative;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 56px 48px 48px;
          max-width: 440px;
          width: 100%;
          text-align: center;
          animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
          from { opacity: 0; transform: translateY(20px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .icon-wrap {
          width: 72px;
          height: 72px;
          margin: 0 auto 28px;
          border-radius: 50%;
          background: var(--gold-glow);
          border: 1px solid rgba(201, 168, 76, 0.3);
          display: flex;
          align-items: center;
          justify-content: center;
          animation: pop 0.45s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes pop {
          from { opacity: 0; transform: scale(0.5); }
          to   { opacity: 1; transform: scale(1); }
        }

        .icon-wrap svg {
          width: 34px;
          height: 34px;
          color: var(--gold);
        }

        .wordmark {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--gold);
          opacity: 0.7;
          margin-bottom: 20px;
        }

        h1 {
          font-size: 26px;
          font-weight: 700;
          letter-spacing: -0.02em;
          line-height: 1.2;
          color: var(--text);
          margin-bottom: 12px;
        }

        p {
          font-size: 15px;
          line-height: 1.65;
          color: var(--muted);
          margin-bottom: 36px;
        }

        .btn {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: var(--gold);
          color: #0d1b2e;
          font-size: 14px;
          font-weight: 700;
          letter-spacing: 0.01em;
          padding: 13px 28px;
          border-radius: 8px;
          text-decoration: none;
          transition: background 0.15s, transform 0.12s;
        }

        .btn:hover  { background: var(--gold-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn svg {
          width: 16px;
          height: 16px;
          flex-shrink: 0;
        }

        .divider {
          margin: 36px 0 0;
          border: none;
          border-top: 1px solid var(--border);
        }

        .note {
          margin-top: 20px;
          font-size: 12px;
          color: var(--muted);
          margin-bottom: 0;
        }

        @media (max-width: 480px) {
          .card { padding: 40px 24px 36px; }
          h1    { font-size: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
          .card, .icon-wrap { animation: none; }
        }
    </style>
</head>
<body>
<div class="card">

    <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
    </div>

    <p class="wordmark">Horse Control</p>

    <h1>E-mail confirmado!</h1>

    <p>
        Sua conta está ativa e pronta para uso.<br />
        Faça login para começar a gerenciar seu haras.
    </p>

    <a href="https://app.horsecontrol.com.br/login" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Ir para o login
    </a>

    <hr class="divider" />
    <p class="note">Dúvidas? Entre em contato com o suporte.</p>
</div>
</body>
</html>
