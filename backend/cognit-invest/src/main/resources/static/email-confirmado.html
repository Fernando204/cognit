<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-mail confirmado · Cognit</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --bg:          #f5efe3;
          --surface:     #fffdf8;
          --border:      #e6dcc7;
          --blue:        #1f4e79;
          --green:       #2f7d5b;
          --green-hover: #266a4c;
          --green-glow:  rgba(47, 125, 91, 0.10);
          --text:        #1b2a3a;
          --muted:       #5f6b78;
          --radius:      14px;
        }

        body {
          min-height: 100dvh;
          background: var(--bg);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          color: var(--text);
          padding: 24px;
        }

        body::before {
          content: "";
          position: fixed;
          inset: 0;
          background:
            radial-gradient(ellipse 50% 40% at 15% 10%, rgba(31, 78, 121, 0.07) 0%, transparent 70%),
            radial-gradient(ellipse 50% 40% at 85% 90%, rgba(47, 125, 91, 0.08) 0%, transparent 70%);
          pointer-events: none;
        }

        .card {
          position: relative;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 52px 48px 44px;
          max-width: 440px;
          width: 100%;
          text-align: center;
          overflow: hidden;
          box-shadow: 0 10px 30px rgba(31, 78, 121, 0.08);
          animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .card::before {
          content: "";
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 5px;
          background: linear-gradient(90deg, var(--blue), var(--green));
        }

        @keyframes rise {
          from { opacity: 0; transform: translateY(20px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
          display: block;
          width: 56px;
          height: auto;
          margin: 0 auto 10px;
        }

        .wordmark {
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--blue);
          margin-bottom: 28px;
        }

        .icon-wrap {
          width: 72px;
          height: 72px;
          margin: 0 auto 24px;
          border-radius: 50%;
          background: var(--green-glow);
          border: 1px solid rgba(47, 125, 91, 0.3);
          display: flex;
          align-items: center;
          justify-content: center;
          animation: pop 0.45s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes pop {
          from { opacity: 0; transform: scale(0.5); }
          to   { opacity: 1; transform: scale(1); }
        }

        .icon-wrap svg {
          width: 34px;
          height: 34px;
          color: var(--green);
        }

        h1 {
          font-size: 26px;
          font-weight: 700;
          letter-spacing: -0.02em;
          line-height: 1.2;
          color: var(--text);
          margin-bottom: 12px;
        }

        p {
          font-size: 15px;
          line-height: 1.65;
          color: var(--muted);
          margin-bottom: 32px;
        }

        .btn {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: var(--green);
          color: #ffffff;
          font-size: 14px;
          font-weight: 700;
          letter-spacing: 0.01em;
          padding: 13px 28px;
          border-radius: 8px;
          text-decoration: none;
          transition: background 0.15s, transform 0.12s;
        }

        .btn:hover  { background: var(--green-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:focus-visible { outline: 3px solid rgba(31, 78, 121, 0.35); outline-offset: 2px; }

        .btn svg {
          width: 16px;
          height: 16px;
          flex-shrink: 0;
        }

        .divider {
          margin: 32px 0 0;
          border: none;
          border-top: 1px solid var(--border);
        }

        .note {
          margin-top: 20px;
          font-size: 12px;
          color: #8a95a1;
          margin-bottom: 0;
        }

        @media (max-width: 480px) {
          .card { padding: 40px 24px 36px; }
          h1    { font-size: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
          .card, .icon-wrap { animation: none; }
        }
    </style>
</head>
<body>
<div class="card">

    <!-- Troque pelo caminho do logo do cérebro -->
    <img class="logo" src="logo-cognit.png" alt="Cognit" />
    <p class="wordmark">Cognit</p>

    <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
    </div>

    <h1>E-mail confirmado!</h1>

    <p>
        Sua conta está ativa e pronta para uso.<br />
        Faça login para acessar suas finanças.
    </p>

    <a href="https://SEU-SITE.netlify.app/login" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Ir para o login
    </a>

    <hr class="divider" />
    <p class="note">Dúvidas? Entre em contato com o suporte.</p>
</div>
</body>
</html>
