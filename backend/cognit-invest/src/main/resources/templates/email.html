<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmação</title>
    <style>
        body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
    </style>
</head>
<body style="margin:0;padding:0;">

<div style="background-color:#142130;padding:20px;text-align:center;color: #00E5FF">

    <img src="https://raw.githubusercontent.com/Fernando204/images-assets/e5c805c76b5d0126a33fd370b342aa129bb50bc2/logo.jpeg"
         alt="Logo"
         width="150"
         style="display:block;margin:0 auto 20px auto;">

    <h2>Confirme seu e-mail</h2>
    <p>Clique no link abaixo para ativar sua conta:</p>

    <a th:href="${confirmationLink}"
       style="
        display:inline-block;
        padding:12px 24px;
        background: linear-gradient(135deg, #d4af37 0%, #f6e27a 25%, #d4af37 50%, #b8962e 75%, #f6e27a 100%);
        color:#3a2f0b;
        text-decoration:none;
        border-radius:6px;
        font-weight:bold;
        border:1px solid #b8962e;
   ">
        Confirmar e-mail
    </a>

</div>

</body>

</html>
