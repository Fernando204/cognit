<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirme seu e-mail · Cognit</title>
</head>
<body style="margin:0;padding:0;background-color:#f5efe3;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5efe3;">
    <tr>
        <td align="center" style="padding:32px 16px;">

            <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%;max-width:480px;background-color:#fffdf8;border:1px solid #e6dcc7;border-radius:14px;">

                <!-- Faixa de topo -->
                <tr>
                    <td style="height:6px;line-height:6px;font-size:0;border-radius:14px 14px 0 0;
                               background-color:#2f7d5b;background-image:linear-gradient(90deg,#1f4e79 0%,#2f7d5b 100%);">&nbsp;</td>
                </tr>

                <!-- Logo -->
                <tr>
                    <td align="center" style="padding:36px 32px 0 32px;">
                        <!-- Troque pelo link público do logo do cérebro -->
                        <img src="https://raw.githubusercontent.com/Fernando204/images-assets/c84a81cb5fc45c3a55917075f3537c2e97675af5/logo.png"
                             alt="Cognit"
                             width="64"
                             style="display:block;margin:0 auto 12px auto;border:0;">
                        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
                                    font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1f4e79;">
                            Cognit
                        </div>
                    </td>
                </tr>

                <!-- Conteúdo -->
                <tr>
                    <td align="center"
                        style="padding:28px 40px 8px 40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
                        <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.25;font-weight:700;color:#1b2a3a;">
                            Confirme seu e-mail
                        </h1>
                        <p style="margin:0;font-size:15px;line-height:1.65;color:#5f6b78;">
                            Falta só um passo para ativar sua conta.<br>
                            Clique no botão abaixo para confirmar seu endereço de e-mail.
                        </p>
                    </td>
                </tr>

                <!-- Botão -->
                <tr>
                    <td align="center" style="padding:28px 40px 12px 40px;">
                        <a th:href="${confirmationLink}"
                           style="display:inline-block;padding:14px 32px;background-color:#2f7d5b;color:#ffffff;
                                  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
                                  font-size:15px;font-weight:700;text-decoration:none;border-radius:8px;">
                            Confirmar e-mail
                        </a>
                    </td>
                </tr>

                <!-- Rodapé -->
                <tr>
                    <td align="center"
                        style="padding:24px 40px 36px 40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
                        <div style="border-top:1px solid #e6dcc7;padding-top:20px;font-size:12px;line-height:1.6;color:#8a95a1;">
                            Se você não criou uma conta no Cognit, ignore esta mensagem.
                        </div>
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
